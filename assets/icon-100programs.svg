<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="100 个 Python 项目进度图标">
  <rect width="100" height="100" rx="20" fill="#ffffff"/>
  <!-- 进度环：整环为浅灰轨道，米色弧是已完成的那一段 -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#dcdcdc" stroke-width="6"/>
  <circle cx="50" cy="50" r="38" fill="none" stroke="#d7c4a8" stroke-width="6" stroke-linecap="round"
          stroke-dasharray="179 239" transform="rotate(-90 50 50)"/>
  <!-- 环内的「100」：圆头笔画，外沿贴在进度环内侧 -->
  <g fill="none" stroke="#2c3e50" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"
     transform="translate(50,50) scale(0.88) translate(-50,-50)">
    <path d="M45 37 L39.5 43 L39.5 63"/>
    <path d="M33 65.5 L46 65.5"/>
    <rect x="52" y="37" width="14" height="26" rx="6.5"/>
    <rect x="70" y="37" width="14" height="26" rx="6.5"/>
  </g>
</svg>
